[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "second-brain-agent"
version = "0.2.0"
description = "MCP Server: Knowledge assistant grounded in local markdown files with AI synthesis"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "David Alba", email = "david@example.com"}
]
keywords = ["mcp", "knowledge-base", "ai", "markdown"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Web framework (for future API server)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    # Data processing
    "pyyaml>=6.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
]
vector = [
    # Optional: vector embeddings for Phase 4+
    # "llama-index>=0.9.0",
    # "langchain>=0.1.0",
    # "openai>=1.3.0",
]
git = [
    # Optional: Git integration
    # "GitPython>=3.1.40",
]
monitoring = [
    # Optional: Performance monitoring
    # "prometheus-client>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/davidalba/Second-Brain-Agent"
Documentation = "https://github.com/davidalba/Second-Brain-Agent#readme"
Repository = "https://github.com/davidalba/Second-Brain-Agent.git"
"Bug Tracker" = "https://github.com/davidalba/Second-Brain-Agent/issues"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp"]
